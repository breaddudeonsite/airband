<!DOCTYPE html>

		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<style>
html, body { margin: 0; background: #07070d !important; overflow: hidden; }
#canvas { position: fixed; left: 0; top: 0; z-index: 2; background: transparent !important; }
#airdrums-cam { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; pointer-events: none; background: #07070d; }
</style>
<script>
(function () {
  'use strict';

  var VER = '0.10.14';
  var CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + VER;
  var MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

  var st = {
    status: 'Tap to start',
    started: false,
    running: false,
    facing: 'user',
    mirror: true,
    video: null,
    stream: null,
    landmarker: null,
    queue: [],
    lastTs: 0,
    lastVT: -1,
    gen: 0,
    busy: false,
    stick: 1.0,      // virtual stick length in palm lengths past the knuckles (0 = off)
    ft: [],          // timestamps of recent tracked frames, for the FPS readout
    det: 0,          // smoothed ms per detectForVideo call
    camFps: 0
  };
  var slots = [
    { x: 0, y: 0, t: 0, active: false, miss: 0 },
    { x: 0, y: 0, t: 0, active: false, miss: 0 }
  ];

  function push(o) {
    st.queue.push(o);
    if (st.queue.length > 96) st.queue.shift();
  }

  function round4(v) { return Math.round(v * 10000) / 10000; }

  function ensureVideo() {
    if (st.video) return st.video;
    var v = document.createElement('video');
    v.id = 'airdrums-cam';
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');
    v.muted = true;
    v.autoplay = true;
    document.body.appendChild(v);
    st.video = v;
    return v;
  }

  function stopCamera() {
    if (st.stream) {
      st.stream.getTracks().forEach(function (t) { t.stop(); });
      st.stream = null;
    }
  }

  async function startCamera() {
    stopCamera();
    var stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: st.facing, width: { ideal: 480 }, height: { ideal: 360 }, frameRate: { ideal: 60 } }
      });
    } catch (e) {
      if (e && (e.name === 'OverconstrainedError' || e.name === 'NotFoundError')) {
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
      } else {
        throw e;
      }
    }
    st.stream = stream;
    try {
      var trk = stream.getVideoTracks()[0];
      st.camFps = Math.round((trk.getSettings && trk.getSettings().frameRate) || 0);
    } catch (e) { st.camFps = 0; }
    var v = ensureVideo();
    v.srcObject = stream;
    v.style.transform = st.mirror ? 'scaleX(-1)' : 'none';
    v.style.display = 'block';
    await v.play();
  }

  async function loadLandmarker() {
    if (st.landmarker) return st.landmarker;
    var vision = await import(CDN + '/vision_bundle.mjs');
    var files = await vision.FilesetResolver.forVisionTasks(CDN + '/wasm');
    function opts(delegate) {
      return {
        baseOptions: { modelAssetPath: MODEL, delegate: delegate },
        runningMode: 'VIDEO',
        numHands: 2,
        minHandDetectionConfidence: 0.35,
        minHandPresenceConfidence: 0.35,
        minTrackingConfidence: 0.35
      };
    }
    try {
      st.landmarker = await vision.HandLandmarker.createFromOptions(files, opts('GPU'));
    } catch (e) {
      console.warn('airdrums: GPU delegate failed, using CPU', e);
      st.landmarker = await vision.HandLandmarker.createFromOptions(files, opts('CPU'));
    }
    return st.landmarker;
  }

  function mapPoint(lx, ly) {
    var v = st.video;
    var vw = v.videoWidth, vh = v.videoHeight;
    var W = window.innerWidth, H = window.innerHeight;
    var sc = Math.max(W / vw, H / vh);
    var dw = vw * sc, dh = vh * sc;
    var ox = (W - dw) / 2, oy = (H - dh) / 2;
    var fx = st.mirror ? (1 - lx) : lx;
    return [(ox + fx * dw) / W, (oy + ly * dh) / H];
  }

  function assignSlots(hands, t) {
    var out = [-1, -1];
    function recent(s) {
      var age = t - slots[s].t;
      return slots[s].active && age >= 0 && age < 500;
    }
    function dist(s, h) {
      var dx = slots[s].x - h.x, dy = slots[s].y - h.y;
      return Math.sqrt(dx * dx + dy * dy);
    }
    if (hands.length === 1) {
      var h = hands[0], best = -1, bd = 1e9;
      for (var s = 0; s < 2; s++) {
        if (recent(s)) {
          var dd = dist(s, h);
          if (dd < bd) { bd = dd; best = s; }
        }
      }
      if (best < 0 || bd > 0.4) best = h.x < 0.5 ? 0 : 1;
      out[best] = 0;
    } else if (hands.length >= 2) {
      var a = hands[0], b = hands[1];
      if (recent(0) && recent(1)) {
        var straight = dist(0, a) + dist(1, b);
        var swapped = dist(1, a) + dist(0, b);
        if (straight <= swapped) { out[0] = 0; out[1] = 1; } else { out[0] = 1; out[1] = 0; }
      } else if (a.x <= b.x) { out[0] = 0; out[1] = 1; } else { out[0] = 1; out[1] = 0; }
    }
    return out;
  }

  function handle(res, t) {
    var lms = (res && res.landmarks) ? res.landmarks : [];
    var hands = [];
    for (var i = 0; i < lms.length && i < 2; i++) {
      var lm = lms[i];
      var kx = (lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 4;
      var ky = (lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 4;
      var lx, ly;
      if (st.stick > 0) {
        lx = kx + st.stick * (lm[9].x - lm[0].x);
        ly = ky + st.stick * (lm[9].y - lm[0].y);
      } else {
        lx = 0.35 * lm[8].x + 0.65 * kx;
        ly = 0.35 * lm[8].y + 0.65 * ky;
      }
      var p = mapPoint(lx, ly);
      var bp = mapPoint(kx, ky);
      hands.push({ x: p[0], y: p[1], bx: bp[0], by: bp[1] });
    }
    var assign = assignSlots(hands, t);
    for (var s = 0; s < 2; s++) {
      var sl = slots[s];
      var hi = assign[s];
      if (hi >= 0) {
        var h = hands[hi];
        sl.x = h.x; sl.y = h.y; sl.t = t; sl.active = true; sl.miss = 0;
        push({ s: s, x: round4(h.x), y: round4(h.y), bx: round4(h.bx), by: round4(h.by), t: Math.round(t * 100) / 100 });
      } else if (sl.active) {
        sl.miss++;
        if (sl.miss >= 3) {
          sl.active = false;
          push({ s: s, lost: 1 });
        }
      }
    }
    var n = hands.length;
    st.status = n === 0 ? 'Show your hands to the camera' : ('Tracking ' + n + (n === 1 ? ' hand' : ' hands'));
  }

  function onFrame(g, meta) {
    if (g !== st.gen || !st.running) return;
    try {
      var v = st.video;
      if (st.landmarker && v.readyState >= 2 && v.videoWidth > 0) {
        var fresh = meta ? true : (v.currentTime !== st.lastVT);
        if (fresh) {
          st.lastVT = v.currentTime;
          var ts = performance.now();
          if (ts <= st.lastTs) ts = st.lastTs + 1;
          st.lastTs = ts;
          var t0 = performance.now();
          var res = st.landmarker.detectForVideo(v, ts);
          var t1 = performance.now();
          st.det = st.det ? st.det * 0.9 + (t1 - t0) * 0.1 : (t1 - t0);
          st.ft.push(t1);
          var t = (meta && meta.mediaTime != null) ? meta.mediaTime * 1000 : ts;
          handle(res, t);
        }
      }
    } catch (e) {
      console.warn('airdrums: frame error', e);
    }
    schedule(g);
  }

  function schedule(g) {
    if (g !== st.gen || !st.running) return;
    var v = st.video;
    if (v.requestVideoFrameCallback) {
      v.requestVideoFrameCallback(function (now, meta) { onFrame(g, meta); });
    } else {
      requestAnimationFrame(function () { onFrame(g, null); });
    }
  }

  function resetSlots() {
    for (var i = 0; i < 2; i++) {
      if (slots[i].active) push({ s: i, lost: 1 });
      slots[i].active = false;
      slots[i].miss = 0;
    }
  }

  async function begin() {
    if (st.busy) return;
    st.busy = true;
    st.running = false;
    st.gen++;
    var g = st.gen;
    st.status = 'Starting camera...';
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Camera API unavailable (the page must be served over https)');
      }
      await startCamera();
    } catch (e) {
      console.warn('airdrums: camera error', e);
      st.status = 'Camera unavailable - tap the pads or press 1-8';
      if (st.video) st.video.style.display = 'none';
      st.busy = false;
      return;
    }
    try {
      st.status = 'Loading hand tracking...';
      await loadLandmarker();
    } catch (e) {
      console.warn('airdrums: model error', e);
      st.status = 'Hand tracking failed to load - tap the pads or press 1-8';
      st.busy = false;
      return;
    }
    resetSlots();
    st.lastTs = 0;
    st.lastVT = -1;
    st.running = true;
    st.status = 'Show your hands to the camera';
    st.busy = false;
    schedule(g);
  }

  var midi = { access: null, outs: [], idx: -1, supported: !!navigator.requestMIDIAccess };

  function refreshOuts() {
    var prevId = (midi.idx >= 0 && midi.outs[midi.idx]) ? midi.outs[midi.idx].id : null;
    midi.outs = [];
    midi.access.outputs.forEach(function (o) { midi.outs.push(o); });
    midi.idx = -1;
    if (prevId) {
      for (var i = 0; i < midi.outs.length; i++) {
        if (midi.outs[i].id === prevId) midi.idx = i;
      }
    }
  }

  function midiLabel() {
    if (!midi.supported) return 'MIDI N/A';
    if (!midi.access) return 'MIDI OFF';
    if (midi.idx < 0) return midi.outs.length ? 'MIDI OFF' : 'MIDI: no ports';
    return 'MIDI: ' + String(midi.outs[midi.idx].name).slice(0, 12);
  }

  async function midiCycle() {
    if (!midi.supported) return;
    releaseHeld();
    if (!midi.access) {
      try {
        midi.access = await navigator.requestMIDIAccess({ sysex: false });
        midi.access.onstatechange = refreshOuts;
      } catch (e) {
        console.warn('airdrums: MIDI access denied', e);
        midi.supported = false;
        return;
      }
      refreshOuts();
      var pick = -1;
      for (var i = 0; i < midi.outs.length; i++) {
        if (/loop|iac|virtual|bus/i.test(midi.outs[i].name)) { pick = i; break; }
      }
      if (pick < 0 && midi.outs.length) pick = 0;
      midi.idx = pick;
      return;
    }
    refreshOuts();
    midi.idx = (midi.idx + 1 >= midi.outs.length) ? -1 : midi.idx + 1;
  }

  function midiNote(note, vel) {
    if (midi.idx < 0 || !midi.outs[midi.idx]) return;
    var out = midi.outs[midi.idx];
    var n = note & 127;
    var v = Math.max(1, Math.min(127, vel | 0));
    try {
      out.send([0x99, n, v]);
      out.send([0x89, n, 0], performance.now() + 60);
    } catch (e) {
      console.warn('airdrums: MIDI send failed', e);
    }
  }

  var held = { notes: [], timer: 0 };

  function releaseHeld() {
    if (held.timer) { clearTimeout(held.timer); held.timer = 0; }
    var out = midi.outs[midi.idx];
    if (out) {
      try {
        for (var i = 0; i < held.notes.length; i++) out.send([0x80, held.notes[i] & 127, 0]);
      } catch (e) { /* port went away */ }
    }
    held.notes = [];
  }

  function midiStrum(notes, vel, gap) {
    var g = gap > 0 ? gap : 12;
    if (midi.idx < 0 || !midi.outs[midi.idx]) return;
    var out = midi.outs[midi.idx];
    var v = Math.max(1, Math.min(127, vel | 0));
    try {
      releaseHeld();
      var now = performance.now();
      for (var j = 0; j < notes.length; j++) {
        out.send([0x90, notes[j] & 127, v], now + j * g);
      }
      held.notes = notes.slice();
      held.timer = setTimeout(releaseHeld, 2500);
    } catch (e) {
      console.warn('airdrums: MIDI strum failed', e);
    }
  }

  var lastCC = {};
  function midiCC(cc, val) {
    if (midi.idx < 0 || !midi.outs[midi.idx]) return;
    var v = Math.max(0, Math.min(127, val | 0));
    if (lastCC[cc] === v) return;
    lastCC[cc] = v;
    try {
      midi.outs[midi.idx].send([0xB0, cc & 127, v]);
    } catch (e) { /* port went away */ }
  }

  window.airDrums = {
    midiCycle: midiCycle,
    midiNote: midiNote,
    midiStrum: midiStrum,
    midiCC: midiCC,
    midiRelease: releaseHeld,
    start: function () {
      if (st.started) return;
      st.started = true;
      begin();
    },
    flip: function () {
      if (!st.started) return;
      st.facing = st.facing === 'user' ? 'environment' : 'user';
      st.mirror = st.facing === 'user';
      begin();
    },
    setStick: function (v) {
      v = +v;
      st.stick = isFinite(v) ? Math.max(0, Math.min(3, v)) : 1.0;
    },
    buzz: function (ms) {
      try { if (navigator.vibrate) navigator.vibrate(ms | 0); } catch (e) { /* unsupported */ }
    },
    poll: function () {
      var now = performance.now();
      while (st.ft.length && now - st.ft[0] > 1000) st.ft.shift();
      var out = JSON.stringify({
        status: st.status, midi: midiLabel(), midi_on: midi.idx >= 0,
        fps: st.running ? st.ft.length : 0, cam: st.camFps, det: Math.round(st.det),
        samples: st.queue
      });
      st.queue = [];
      return out;
    }
  };
})();
</script>

	<body>
		<canvas id="canvas">

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":50728,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
