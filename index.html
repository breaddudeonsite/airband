<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Air Drums</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<style>
html, body { margin: 0; background: #07070d !important; overflow: hidden; }
#canvas { position: fixed; left: 0; top: 0; z-index: 2; background: transparent !important; }
#airdrums-cam { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; pointer-events: none; background: #07070d; }
</style>
<script>
(function () {
  'use strict';

  var VER = '0.10.14';
  var CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + VER;
  var POSE_MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
  var HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

  var st = {
    status: 'Tap to start',
    started: false,
    running: false,
    facing: 'user',
    mirror: true,
    video: null,
    stream: null,
    pose: null,
    hands: null,       // optional HandLandmarker for higher-precision sticks
    usePose: true,
    queue: [],
    lastTs: 0,
    lastVT: -1,
    gen: 0,
    busy: false,
    stick: 1.0,
    ft: [],
    det: 0,
    camFps: 0
  };

  var slots = [
    { x: 0, y: 0, t: 0, active: false, miss: 0 },
    { x: 0, y: 0, t: 0, active: false, miss: 0 },
    { x: 0, y: 0, t: 0, active: false, miss: 0 },
    { x: 0, y: 0, t: 0, active: false, miss: 0 }
  ];

  function push(o) {
    st.queue.push(o);
    if (st.queue.length > 120) st.queue.shift();
  }

  function round4(v) { return Math.round(v * 10000) / 10000; }

  function ensureVideo() {
    if (st.video) return st.video;
    var v = document.createElement('video');
    v.id = 'airdrums-cam';
    v.setAttribute('playsinline', '');
    v.setAttribute('webkit-playsinline', '');
    v.muted = true;
    v.autoplay = true;
    document.body.appendChild(v);
    st.video = v;
    return v;
  }

  function stopCamera() {
    if (st.stream) {
      st.stream.getTracks().forEach(function (t) { t.stop(); });
      st.stream = null;
    }
  }

  async function startCamera() {
    stopCamera();
    var stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: st.facing, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } }
      });
    } catch (e) {
      if (e && (e.name === 'OverconstrainedError' || e.name === 'NotFoundError')) {
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
      } else {
        throw e;
      }
    }
    st.stream = stream;
    try {
      var trk = stream.getVideoTracks()[0];
      st.camFps = Math.round((trk.getSettings && trk.getSettings().frameRate) || 0);
    } catch (e) { st.camFps = 0; }
    var v = ensureVideo();
    v.srcObject = stream;
    v.style.transform = st.mirror ? 'scaleX(-1)' : 'none';
    v.style.display = 'block';
    await v.play();
  }

  async function loadLandmarker() {
    var vision = await import(CDN + '/vision_bundle.mjs');
    var files = await vision.FilesetResolver.forVisionTasks(CDN + '/wasm');

    try {
      st.pose = await vision.PoseLandmarker.createFromOptions(files, {
        baseOptions: { modelAssetPath: POSE_MODEL, delegate: 'GPU' },
        runningMode: 'VIDEO',
        numPoses: 1,
        minPoseDetectionConfidence: 0.4,
        minPosePresenceConfidence: 0.4,
        minTrackingConfidence: 0.4
      });
      st.usePose = true;
      st.status = 'Pose ready';
    } catch (e) {
      console.warn('airdrums: pose GPU failed, trying CPU', e);
      try {
        st.pose = await vision.PoseLandmarker.createFromOptions(files, {
          baseOptions: { modelAssetPath: POSE_MODEL, delegate: 'CPU' },
          runningMode: 'VIDEO',
          numPoses: 1,
          minPoseDetectionConfidence: 0.4,
          minPosePresenceConfidence: 0.4,
          minTrackingConfidence: 0.4
        });
        st.usePose = true;
      } catch (e2) {
        console.warn('airdrums: pose failed, falling back to hands only', e2);
        st.usePose = false;
      }
    }

    try {
      function hopts(delegate) {
        return {
          baseOptions: { modelAssetPath: HAND_MODEL, delegate: delegate },
          runningMode: 'VIDEO',
          numHands: 2,
          minHandDetectionConfidence: 0.35,
          minHandPresenceConfidence: 0.35,
          minTrackingConfidence: 0.35
        };
      }
      try {
        st.hands = await vision.HandLandmarker.createFromOptions(files, hopts('GPU'));
      } catch (e) {
        st.hands = await vision.HandLandmarker.createFromOptions(files, hopts('CPU'));
      }
    } catch (e) {
      console.warn('airdrums: hand model optional, pose wrists will be used', e);
      st.hands = null;
    }
    return st.pose || st.hands;
  }

  function mapPoint(lx, ly) {
    var v = st.video;
    var vw = v.videoWidth, vh = v.videoHeight;
    var W = window.innerWidth, H = window.innerHeight;
    var sc = Math.max(W / vw, H / vh);
    var dw = vw * sc, dh = vh * sc;
    var ox = (W - dw) / 2, oy = (H - dh) / 2;
    var fx = st.mirror ? (1 - lx) : lx;
    return [(ox + fx * dw) / W, (oy + ly * dh) / H];
  }

  function assignHandSlots(hands, t) {
    var out = [-1, -1];
    function recent(s) {
      var age = t - slots[s].t;
      return slots[s].active && age >= 0 && age < 500;
    }
    function dist(s, h) {
      var dx = slots[s].x - h.x, dy = slots[s].y - h.y;
      return Math.sqrt(dx * dx + dy * dy);
    }
    if (hands.length === 1) {
      var h = hands[0], best = -1, bd = 1e9;
      for (var s = 0; s < 2; s++) {
        if (recent(s)) {
          var dd = dist(s, h);
          if (dd < bd) { bd = dd; best = s; }
        }
      }
      if (best < 0 || bd > 0.4) best = h.x < 0.5 ? 0 : 1;
      out[best] = 0;
    } else if (hands.length >= 2) {
      var a = hands[0], b = hands[1];
      if (recent(0) && recent(1)) {
        var straight = dist(0, a) + dist(1, b);
        var swapped = dist(1, a) + dist(0, b);
        if (straight <= swapped) { out[0] = 0; out[1] = 1; } else { out[0] = 1; out[1] = 0; }
      } else if (a.x <= b.x) { out[0] = 0; out[1] = 1; } else { out[0] = 1; out[1] = 0; }
    }
    return out;
  }

  function updateSlot(s, x, y, bx, by, t) {
    var sl = slots[s];
    sl.x = x; sl.y = y; sl.t = t; sl.active = true; sl.miss = 0;
    var o = { s: s, x: round4(x), y: round4(y), t: Math.round(t * 100) / 100 };
    if (bx != null) { o.bx = round4(bx); o.by = round4(by); }
    push(o);
  }

  function missSlot(s) {
    var sl = slots[s];
    if (sl.active) {
      sl.miss++;
      if (sl.miss >= 3) {
        sl.active = false;
        push({ s: s, lost: 1 });
      }
    }
  }

  function handlePose(res, t) {
    var lms = (res && res.landmarks && res.landmarks[0]) ? res.landmarks[0] : null;
    if (!lms || lms.length < 33) {
      for (var s = 0; s < 4; s++) missSlot(s);
      st.status = 'Show your body to the camera';
      return;
    }

    var ls = lms[11], rs = lms[12];
    var lh = lms[23], rh = lms[24];
    var tx = (ls.x + rs.x) * 0.5;
    var ty = (ls.y + rs.y) * 0.5 * 0.7 + (lh.y + rh.y) * 0.5 * 0.3; // blend toward hips a bit
    var shoulderW = Math.abs(rs.x - ls.x);
    if (shoulderW < 0.05) shoulderW = 0.18;
    var tp = mapPoint(tx, ty);
    push({ tx: round4(tp[0]), ty: round4(tp[1]), ts: round4(shoulderW) });

    var handPts = [];
    if (lms[15].visibility > 0.3 || lms[15].presence > 0.3) {
      var lx = lms[15].x, ly = lms[15].y;
      var ix = lms[19] ? lms[19].x : lx, iy = lms[19] ? lms[19].y : ly;
      var stick = st.stick;
      var tipx = lx + stick * (ix - lx) * 1.6;
      var tipy = ly + stick * (iy - ly) * 1.6;
      var p = mapPoint(tipx, tipy);
      var bp = mapPoint(lx, ly);
      handPts.push({ x: p[0], y: p[1], bx: bp[0], by: bp[1], side: 'L' });
    }
    if (lms[16].visibility > 0.3 || lms[16].presence > 0.3) {
      var rx = lms[16].x, ry = lms[16].y;
      var rix = lms[20] ? lms[20].x : rx, riy = lms[20] ? lms[20].y : ry;
      var tipx2 = rx + st.stick * (rix - rx) * 1.6;
      var tipy2 = ry + st.stick * (riy - ry) * 1.6;
      var p2 = mapPoint(tipx2, tipy2);
      var bp2 = mapPoint(rx, ry);
      handPts.push({ x: p2[0], y: p2[1], bx: bp2[0], by: bp2[1], side: 'R' });
    }


    var assign = assignHandSlots(handPts, t);
    for (var s = 0; s < 2; s++) {
      var hi = assign[s];
      if (hi >= 0) {
        var h = handPts[hi];
        updateSlot(s, h.x, h.y, h.bx, h.by, t);
      } else {
        missSlot(s);
      }
    }

    function footPoint(ankle, tip) {
      var ax = ankle.x, ay = ankle.y;
      if (tip && (tip.visibility > 0.2 || tip.presence > 0.2)) {
        ax = ax * 0.4 + tip.x * 0.6;
        ay = ay * 0.4 + tip.y * 0.6;
      }
      return mapPoint(ax, ay);
    }
    var leftVis = (lms[27].visibility || lms[27].presence || 0);
    var rightVis = (lms[28].visibility || lms[28].presence || 0);
    if (leftVis > 0.25) {
      var lf = footPoint(lms[27], lms[31]);
      updateSlot(2, lf[0], lf[1], null, null, t);
    } else {
      missSlot(2);
    }
    if (rightVis > 0.25) {
      var rf = footPoint(lms[28], lms[32]);
      updateSlot(3, rf[0], rf[1], null, null, t);
    } else {
      missSlot(3);
    }

    var nH = handPts.length;
    var nF = (leftVis > 0.25 ? 1 : 0) + (rightVis > 0.25 ? 1 : 0);
    st.status = 'Tracking ' + nH + ' hand' + (nH === 1 ? '' : 's') +
      (nF ? (', ' + nF + ' foot' + (nF === 1 ? '' : 's')) : '') +
      ' · body';
  }

  function handleHands(res, t) {
    var lms = (res && res.landmarks) ? res.landmarks : [];
    var hands = [];
    for (var i = 0; i < lms.length && i < 2; i++) {
      var lm = lms[i];
      var kx = (lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 4;
      var ky = (lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 4;
      var lx, ly;
      if (st.stick > 0) {
        lx = kx + st.stick * (lm[9].x - lm[0].x);
        ly = ky + st.stick * (lm[9].y - lm[0].y);
      } else {
        lx = 0.35 * lm[8].x + 0.65 * kx;
        ly = 0.35 * lm[8].y + 0.65 * ky;
      }
      var p = mapPoint(lx, ly);
      var bp = mapPoint(kx, ky);
      hands.push({ x: p[0], y: p[1], bx: bp[0], by: bp[1] });
    }
    var assign = assignHandSlots(hands, t);
    for (var s = 0; s < 2; s++) {
      var hi = assign[s];
      if (hi >= 0) {
        var h = hands[hi];
        updateSlot(s, h.x, h.y, h.bx, h.by, t);
      }
    }
  }

  function onFrame(g, meta) {
    if (g !== st.gen || !st.running) return;
    try {
      var v = st.video;
      if (v.readyState >= 2 && v.videoWidth > 0) {
        var fresh = meta ? true : (v.currentTime !== st.lastVT);
        if (fresh) {
          st.lastVT = v.currentTime;
          var ts = performance.now();
          if (ts <= st.lastTs) ts = st.lastTs + 1;
          st.lastTs = ts;
          var t0 = performance.now();
          var t = (meta && meta.mediaTime != null) ? meta.mediaTime * 1000 : ts;

          if (st.pose) {
            var pres = st.pose.detectForVideo(v, ts);
            handlePose(pres, t);
          }
          if (st.hands) {
            var hres = st.hands.detectForVideo(v, ts);
            handleHands(hres, t);
          }
          if (!st.pose && !st.hands) {
            st.status = 'No tracker loaded';
          }

          var t1 = performance.now();
          st.det = st.det ? st.det * 0.9 + (t1 - t0) * 0.1 : (t1 - t0);
          st.ft.push(t1);
        }
      }
    } catch (e) {
      console.warn('airdrums: frame error', e);
    }
    schedule(g);
  }

  function schedule(g) {
    if (g !== st.gen || !st.running) return;
    var v = st.video;
    if (v.requestVideoFrameCallback) {
      v.requestVideoFrameCallback(function (now, meta) { onFrame(g, meta); });
    } else {
      requestAnimationFrame(function () { onFrame(g, null); });
    }
  }

  function resetSlots() {
    for (var i = 0; i < 4; i++) {
      if (slots[i].active) push({ s: i, lost: 1 });
      slots[i].active = false;
      slots[i].miss = 0;
    }
  }

  async function begin() {
    if (st.busy) return;
    st.busy = true;
    st.running = false;
    st.gen++;
    var g = st.gen;
    st.status = 'Starting camera...';
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error('Camera API unavailable (the page must be served over https)');
      }
      await startCamera();
    } catch (e) {
      console.warn('airdrums: camera error', e);
      st.status = 'Camera unavailable - tap the pads or press 1-8';
      if (st.video) st.video.style.display = 'none';
      st.busy = false;
      return;
    }
    try {
      st.status = 'Loading pose + hand tracking...';
      await loadLandmarker();
    } catch (e) {
      console.warn('airdrums: model error', e);
      st.status = 'Tracking failed to load - tap the pads or press 1-8';
      st.busy = false;
      return;
    }
    resetSlots();
    st.lastTs = 0;
    st.lastVT = -1;
    st.running = true;
    st.status = 'Show your body and hands to the camera';
    st.busy = false;
    schedule(g);
  }

  var midi = { access: null, outs: [], idx: -1, supported: !!navigator.requestMIDIAccess };

  function refreshOuts() {
    var prevId = (midi.idx >= 0 && midi.outs[midi.idx]) ? midi.outs[midi.idx].id : null;
    midi.outs = [];
    if (midi.access) midi.access.outputs.forEach(function (o) { midi.outs.push(o); });
    midi.idx = -1;
    if (prevId) {
      for (var i = 0; i < midi.outs.length; i++) {
        if (midi.outs[i].id === prevId) midi.idx = i;
      }
    }
  }

  function midiLabel() {
    if (!midi.supported) return 'MIDI N/A';
    if (!midi.access) return 'MIDI OFF';
    if (midi.idx < 0) return midi.outs.length ? 'MIDI OFF' : 'MIDI: no ports';
    return 'MIDI: ' + String(midi.outs[midi.idx].name).slice(0, 12);
  }

  async function midiCycle() {
    if (!midi.supported) return;
    try {
      if (!midi.access) {
        midi.access = await navigator.requestMIDIAccess({ sysex: false });
        midi.access.onstatechange = refreshOuts;
        refreshOuts();
        for (var i = 0; i < midi.outs.length; i++) {
          var n = String(midi.outs[i].name).toLowerCase();
          if (n.indexOf('loop') >= 0 || n.indexOf('iac') >= 0 || n.indexOf('virtual') >= 0 || n.indexOf('bus') >= 0) {
            midi.idx = i;
            return;
          }
        }
        if (midi.outs.length) midi.idx = 0;
        return;
      }
      refreshOuts();
      midi.idx++;
      if (midi.idx >= midi.outs.length) midi.idx = -1;
    } catch (e) {
      console.warn('airdrums: MIDI access failed', e);
      midi.access = null;
      midi.idx = -1;
    }
  }

  function midiNote(note, vel, ch) {
    if (midi.idx < 0 || !midi.outs[midi.idx]) return;
    try {
      var out = midi.outs[midi.idx];
      var c = (ch || 10) - 1;
      var v = Math.max(1, Math.min(127, vel | 0));
      out.send([0x90 | (c & 0x0f), note & 127, v]);
      setTimeout(function () {
        try { out.send([0x80 | (c & 0x0f), note & 127, 0]); } catch (e) {}
      }, 120);
    } catch (e) {
      console.warn('airdrums: MIDI send failed', e);
    }
  }

  var held = { notes: [], timer: 0 };

  function releaseHeld() {
    if (held.timer) { clearTimeout(held.timer); held.timer = 0; }
    var out = midi.outs[midi.idx];
    if (out) {
      try {
        for (var i = 0; i < held.notes.length; i++) out.send([0x80, held.notes[i] & 127, 0]);
      } catch (e) { /* port went away */ }
    }
    held.notes = [];
  }

  function midiStrum(notes, vel, gap) {
    var g = gap > 0 ? gap : 12;
    if (midi.idx < 0 || !midi.outs[midi.idx]) return;
    var out = midi.outs[midi.idx];
    var v = Math.max(1, Math.min(127, vel | 0));
    try {
      releaseHeld();
      var now = performance.now();
      for (var j = 0; j < notes.length; j++) {
        out.send([0x90, notes[j] & 127, v], now + j * g);
      }
      held.notes = notes.slice();
      held.timer = setTimeout(releaseHeld, 2500);
    } catch (e) {
      console.warn('airdrums: MIDI strum failed', e);
    }
  }

  var lastCC = {};
  function midiCC(cc, val) {
    if (midi.idx < 0 || !midi.outs[midi.idx]) return;
    var v = Math.max(0, Math.min(127, val | 0));
    if (lastCC[cc] === v) return;
    lastCC[cc] = v;
    try {
      midi.outs[midi.idx].send([0xB0, cc & 127, v]);
    } catch (e) { /* port went away */ }
  }

  window.airDrums = {
    midiCycle: midiCycle,
    midiNote: midiNote,
    midiStrum: midiStrum,
    midiCC: midiCC,
    midiRelease: releaseHeld,
    start: function () {
      if (st.started) return;
      st.started = true;
      begin();
    },
    flip: function () {
      if (!st.started) return;
      st.facing = st.facing === 'user' ? 'environment' : 'user';
      st.mirror = st.facing === 'user';
      begin();
    },
    setStick: function (v) {
      v = +v;
      st.stick = isFinite(v) ? Math.max(0, Math.min(3, v)) : 1.0;
    },
    buzz: function (ms) {
      try { if (navigator.vibrate) navigator.vibrate(ms | 0); } catch (e) { /* unsupported */ }
    },
    poll: function () {
      var now = performance.now();
      while (st.ft.length && now - st.ft[0] > 1000) st.ft.shift();
      var out = JSON.stringify({
        status: st.status, midi: midiLabel(), midi_on: midi.idx >= 0,
        fps: st.running ? st.ft.length : 0, cam: st.camFps, det: Math.round(st.det),
        samples: st.queue
      });
      st.queue = [];
      return out;
    }
  };
})();
</script>

		<div id="status">

			<progress id="status-progress"></progress>
			<div id="status-notice"></div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":54456,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
